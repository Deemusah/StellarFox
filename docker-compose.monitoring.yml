version: '3.9'

# ============================================================
# docker-compose.monitoring.yml — Prometheus + Alertmanager + Grafana
# ============================================================
#
# An optional overlay that adds the full observability stack described in
# docs/observability.md. It is deliberately kept out of docker-compose.yml so
# the default `docker compose up` behaviour is unchanged.
#
# Run the whole stack (app + monitoring) from the repository root:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Run only the monitoring services against an already running stack:
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Endpoints:
#   Prometheus    http://localhost:9090
#   Alertmanager  http://localhost:9093
#   Grafana       http://localhost:3003  (admin / admin)
#
# Every configuration file is bind-mounted read-only from ./monitoring so the
# alerting rules and dashboards can be edited without rebuilding images.
# ============================================================

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - alertmanager
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_INSTALL_PLUGINS: ''
    ports:
      - '3003:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data: