name: Deploy to Stellar Testnet

on:
  workflow_dispatch:
    inputs:
      admin_secret_key:
        description: 'Admin secret key for deployment (S...). Must already be set as a GitHub secret if left empty.'
        required: false
        type: string
      oracle_addresses:
        description: 'Comma-separated oracle Stellar addresses'
        required: false
        type: string
      default_fee_bps:
        description: 'Platform fee in bps (default: 200)'
        required: false
        type: number
        default: 200

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan (testnet)
        working-directory: infra/terraform
        env:
          TF_VAR_environment: testnet
          TF_VAR_admin_public_key: ${{ secrets.ADMIN_PUBLIC_KEY }}
          TF_VAR_oracle_addresses: ${{ inputs.oracle_addresses || '' }}
          TF_VAR_default_fee_bps: ${{ inputs.default_fee_bps || 200 }}
        run: terraform plan -input=false -lock=false -out=tfplan

  deploy:
    name: Build & Deploy Contracts
    needs: terraform
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install Stellar CLI
        run: |
          STELLAR_CLI_VERSION='26.1.0'
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xzf - -C /usr/local/bin stellar
          stellar version

      - name: Mask admin secret key in logs
        run: echo "::add-mask::${{ secrets.ADMIN_SECRET_KEY }}"

      - name: Build WASM contracts
        working-directory: contracts
        env:
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
        run: |
          stellar contract build

      - name: Deploy to Testnet
        working-directory: contracts
        env:
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ORACLE_ADDRESSES: ${{ inputs.oracle_addresses || '' }}
          DEFAULT_FEE_BPS: ${{ inputs.default_fee_bps || 200 }}
        run: |
          ./scripts/deploy.sh testnet

      - name: Upload deployments.json
        uses: actions/upload-artifact@v4
        with:
          name: deployments-testnet
          path: contracts/deployments.json
          retention-days: 90

  tls:
    name: Provision & Verify TLS Certificates
    runs-on: ubuntu-latest
    environment: testnet
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::KUBE_CONFIG secret is not set; cannot manage TLS certificates"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Install cert-manager
        run: |
          CERT_MANAGER_VERSION='v1.15.3'
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=180s
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=180s

      - name: Apply Let's Encrypt ClusterIssuer
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          if [ -z "$ACME_EMAIL" ]; then
            echo "::error::ACME_EMAIL secret is not set; cannot register with Let's Encrypt"
            exit 1
          fi
          cat <<EOF | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              email: ${ACME_EMAIL}
              privateKeySecretRef:
                name: letsencrypt-prod-account-key
              solvers:
                - http01:
                    ingress:
                      class: nginx
          EOF

      - name: Apply Certificate with automatic rotation
        env:
          TLS_HOST: ${{ vars.TLS_HOST || 'testnet.stellarforge.example' }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: stellarforge-testnet-tls
            namespace: default
          spec:
            secretName: stellarforge-testnet-tls
            duration: 2160h
            renewBefore: 720h
            privateKey:
              algorithm: ECDSA
              size: 256
              rotationPolicy: Always
            dnsNames:
              - ${TLS_HOST}
            issuerRef:
              name: letsencrypt-prod
              kind: ClusterIssuer
          EOF

      - name: Wait for certificate to become Ready
        run: |
          kubectl wait --for=condition=Ready certificate/stellarforge-testnet-tls \
            --namespace default --timeout=300s

      - name: Verify certificate automation
        run: |
          set -euo pipefail
          echo 'Checking Certificate status conditions...'
          kubectl get certificate stellarforge-testnet-tls -n default -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -q True
          echo 'Checking renewal window is configured...'
          RENEW_BEFORE=$(kubectl get certificate stellarforge-testnet-tls -n default -o jsonpath='{.spec.renewBefore}')
          test -n "$RENEW_BEFORE"
          echo 'Checking private key rotation policy...'
          ROTATION=$(kubectl get certificate stellarforge-testnet-tls -n default -o jsonpath='{.spec.privateKey.rotationPolicy}')
          test "$ROTATION" = 'Always'
          echo 'Checking issued secret exists...'
          kubectl get secret stellarforge-testnet-tls -n default
          echo 'TLS certificate automation verified.'
