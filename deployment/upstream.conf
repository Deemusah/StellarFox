# Blue-Green Upstream Configuration
# This file is dynamically updated by deployment scripts to switch traffic
# between blue and green environments without reloading Nginx.
#
# The ACTIVE_ENV environment variable determines which upstream group is used:
# - When ACTIVE_ENV=blue, traffic routes to backend-blue, indexer-blue, frontend-blue
# - When ACTIVE_ENV=green, traffic routes to backend-green, indexer-green, frontend-green

# Backend upstream pools
upstream backend_blue {
    server backend-blue:3001 max_fails=3 fail_timeout=10s;
}

upstream backend_green {
    server backend-green:3001 max_fails=3 fail_timeout=10s;
}

# Indexer upstream pools
upstream indexer_blue {
    server indexer-blue:3002 max_fails=3 fail_timeout=10s;
}

upstream indexer_green {
    server indexer-green:3002 max_fails=3 fail_timeout=10s;
}

# Frontend upstream pools
upstream frontend_blue {
    server frontend-blue:3000 max_fails=3 fail_timeout=10s;
}

upstream frontend_green {
    server frontend-green:3000 max_fails=3 fail_timeout=10s;
}

# Map ACTIVE_ENV to the appropriate upstream for each service
# This allows dynamic traffic switching without reloading Nginx
map $http_x_deployment_env $backend_upstream {
    "green" backend_green;
    default backend_blue;
}

map $http_x_deployment_env $indexer_upstream {
    "green" indexer_green;
    default indexer_blue;
}

map $http_x_deployment_env $frontend_upstream {
    "green" frontend_green;
    default frontend_blue;
}

# Active environment mappings (checked against env var by scripts)
map $http_x_active_env $backend_active {
    "green" backend_green;
    default backend_blue;
}

map $http_x_active_env $indexer_active {
    "green" indexer_green;
    default indexer_blue;
}

map $http_x_active_env $frontend_active {
    "green" frontend_green;
    default frontend_blue;
}
